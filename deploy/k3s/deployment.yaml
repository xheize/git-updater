apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-updater
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: git-updater
  template:
    metadata:
      labels:
        app: git-updater
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: git-updater
          image: registry.xheize.cc/git-updater:REPLACE_WITH_REVIEWED_TAG
          imagePullPolicy: IfNotPresent
          command: [/app/git-updater]
          # Keep the clone below the mount root: startup may remove ./workspace.
          workingDir: /work
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: git-updater-server-env
          env:
            - name: GIT_AUTH_METHOD
              value: ssh
            - name: GIT_SSH_PRIVATE_KEY
              value: /run/secrets/git/ssh-privatekey
            - name: GIT_SSH_KNOWN_HOSTS_FILE
              value: /run/secrets/git/known_hosts
            - name: JOB_DB_PATH
              value: /app/data/jobs.db
            - name: PORT
              value: "3000"
            - name: AUTO_UPDATE
              value: "true"
            - name: GIT_AUTHOR_NAME
              value: git-updater
            - name: GIT_AUTHOR_EMAIL
              value: git-updater@localhost
            # Set true only after adding GITHUB_WEBHOOK_SECRET to server-env.
            - name: GITHUB_WEBHOOK_ENABLED
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
            - name: git-ssh
              mountPath: /run/secrets/git
              readOnly: true
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            failureThreshold: 18
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: git-updater-data
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: git-ssh
          secret:
            secretName: git-updater-ssh
            defaultMode: 0440

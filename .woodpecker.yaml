# Woodpecker CI Pipeline Configuration for git-updater
# Documentation: https://woodpecker-ci.org/

variables:
  - &golang_image 'golang:1.25.10-alpine'

steps:
  # Step 1: Format check and Static Analysis (Go Vet)
  - name: lint-and-vet
    image: *golang_image
    commands:
      - go fmt ./...
      - go vet ./...
    when:
      event: [push, manual]
      branch: dev
      
  # Step 2: Build and Push Docker image using BuildKit
  - name: build-and-push
    image: moby/buildkit:v0.19.0-buildctl
    commands:
      # BuildKit 데몬 주소 환경변수 지정
      - export BUILDKIT_HOST=tcp://buildkit.buildkit.svc.cluster.local:2395
      # 도커 레지스트리 인증 정보 세팅 (필요시 ~/.docker/config.json 생성 스크립트 추가)
      # 빌드 및 푸시 수행
      - buildctl build \
          --frontend=dockerfile.v0 \
          --local context=. \
          --local dockerfile=. \
          --output type=image,name=registry.xheize.cc/git-updater:latest,push=true
    when:
      event: [push, manual]
      branch: [dev, main]

  